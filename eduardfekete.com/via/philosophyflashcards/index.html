        // --- Main App Component ---
        function App() {
            const [currentIndex, setCurrentIndex] = useState(0);
            const [isFlipped, setIsFlipped] = useState(false);
            const [selectedOption, setSelectedOption] = useState(null);
            const [showResult, setShowResult] = useState(false);

            const card = flashcards[currentIndex];

            const handleOptionSelect = (index) => {
                if (showResult) return; 
                setSelectedOption(index);
                setShowResult(true);
                setIsFlipped(true);
            };

            const handleNext = () => {
                if (currentIndex < flashcards.length - 1) {
                    setCurrentIndex(currentIndex + 1);
                    resetCardState();
                }
            };

            const handlePrev = () => {
                if (currentIndex > 0) {
                    setCurrentIndex(currentIndex - 1);
                    resetCardState();
                }
            };

            const resetCardState = () => {
                setIsFlipped(false);
                setSelectedOption(null);
                setShowResult(false);
            };

            const restart = () => {
                setCurrentIndex(0);
                resetCardState();
            };

            return (
                <div className="min-h-screen bg-slate-50 text-slate-900 font-sans p-4 sm:p-8 flex flex-col items-center">
                    {/* Header */}
                    <div className="max-w-3xl w-full flex items-center justify-between mb-8">
                        <div className="flex items-center gap-2">
                            <BookOpen className="text-blue-600 w-6 h-6" />
                            <h1 className="text-xl font-bold tracking-tight">Philosophy of Science & Eng.</h1>
                        </div>
                        <div className="text-sm font-medium bg-slate-200 px-3 py-1 rounded-full">
                            {currentIndex + 1} / {flashcards.length}
                        </div>
                    </div>

                    {/* Flashcard Container */}
                    <div className="max-w-3xl w-full flex-1 flex flex-col">
                        
                        {/* Flashcard Area */}
                        <div className="flex-1 bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-10 flex flex-col relative overflow-hidden transition-all duration-300">
                            
                            {/* Progress bar */}
                            <div className="absolute top-0 left-0 w-full h-1 bg-slate-100">
                                <div 
                                    className="h-full bg-blue-600 transition-all duration-300"
                                    style={{ width: `${((currentIndex + 1) / flashcards.length) * 100}%` }}
                                ></div>
                            </div>

                            <div className="mb-6">
                                <h2 className="text-xl sm:text-2xl font-semibold leading-snug">
                                    {card.question}
                                </h2>
                            </div>

                            {/* Front of card (Options) */}
                            <div className="flex-1 flex flex-col justify-center space-y-3">
                                {card.options.map((option, idx) => {
                                    
                                    let btnClass = "text-left p-4 rounded-xl border-2 transition-all duration-200 focus:outline-none ";
                                    
                                    if (!showResult) {
                                        btnClass += "border-slate-200 hover:border-blue-400 hover:bg-blue-50 cursor-pointer";
                                    } else {
                                        if (idx === card.correctAnswer) {
                                            btnClass += "border-green-500 bg-green-50 text-green-900"; // Correct answer
                                        } else if (idx === selectedOption) {
                                            btnClass += "border-red-500 bg-red-50 text-red-900"; // Incorrect selection
                                        } else {
                                            btnClass += "border-slate-100 bg-slate-50 text-slate-400 opacity-60 cursor-not-allowed"; // Other options
                                        }
                                    }

                                    return (
                                        <button
                                            key={idx}
                                            onClick={() => handleOptionSelect(idx)}
                                            disabled={showResult}
                                            className={btnClass}
                                        >
                                            <div className="flex items-center gap-3">
                                                <div className={`w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm shrink-0
                                                    ${showResult && idx === card.correctAnswer ? 'bg-green-500 text-white' : 
                                                        showResult && idx === selectedOption ? 'bg-red-500 text-white' : 
                                                        'bg-slate-100 text-slate-600'}`}
                                                >
                                                    {String.fromCharCode(65 + idx)}
                                                </div>
                                                <span className="text-base sm:text-lg">{option}</span>
                                                
                                                {/* Status Icons */}
                                                {showResult && idx === card.correctAnswer && (
                                                    <CheckCircle2 className="w-6 h-6 text-green-600 ml-auto shrink-0" />
                                                )}
                                                {showResult && idx === selectedOption && idx !== card.correctAnswer && (
                                                    <XCircle className="w-6 h-6 text-red-600 ml-auto shrink-0" />
                                                )}
                                            </div>
                                        </button>
                                    );
                                })}
                            </div>

                            {/* Back of card (Explanation) */}
                            {isFlipped && (
                                <div className="mt-8 pt-6 border-t border-slate-100 transition-opacity duration-500 opacity-100">
                                    <h3 className="text-sm font-bold text-slate-400 uppercase tracking-wider mb-2">Explanation</h3>
                                    <p className="text-slate-700 leading-relaxed text-lg">
                                        {card.explanation}
                                    </p>
                                </div>
                            )}

                        </div>

                        {/* Controls */}
                        <div className="flex items-center justify-between mt-8">
                            <button
                                onClick={handlePrev}
                                disabled={currentIndex === 0}
                                className={`flex items-center gap-2 px-4 py-2 rounded-lg font-medium transition-colors
                                    ${currentIndex === 0 ? 'text-slate-400 cursor-not-allowed' : 'text-slate-700 hover:bg-slate-200'}`}
                            >
                                <ChevronLeft className="w-5 h-5" />
                                Previous
                            </button>

                            <button
                                onClick={restart}
                                className="flex items-center gap-2 px-4 py-2 rounded-lg font-medium text-slate-500 hover:text-slate-900 hover:bg-slate-200 transition-colors"
                                title="Restart"
                            >
                                <RefreshCw className="w-5 h-5" />
                            </button>

                            <button
                                onClick={handleNext}
                                disabled={currentIndex === flashcards.length - 1}
                                className={`flex items-center gap-2 px-4 py-2 rounded-lg font-medium transition-colors
                                    ${currentIndex === flashcards.length - 1 ? 'text-slate-400 cursor-not-allowed' : 'text-slate-700 hover:bg-slate-200'}`}
                            >
                                Next
                                <ChevronRight className="w-5 h-5" />
                            </button>
                        </div>

                    </div>
                </div>
            );
        }

        // --- Render the App ---
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
